# Netlify deploy configuration for the static export.
# Build: `npm run build` writes the site to ./out, which Netlify publishes.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Long-cache immutable build assets.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Next emits the generated OG card and Apple icon as extensionless files, so
# Netlify would serve them as octet-stream and some link scrapers would skip
# them. These pin the real type.
[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/apple-icon"
  [headers.values]
    Content-Type = "image/png"

# Static export already emits 404.html; this makes the status code explicit.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
